ms this in a child violates Tribune."},{range:"22—24",title:"Defensio / Defense",verses:"IV.0",teach:"Defense of rights is right, but Tribunal requires Witness spoken thrice before sword. Judgment is on trespass, not on Star.",notForm:"Do NOT teach vengeance as Will. Do NOT teach the child to kill ideas; only to repel those who would thwart the Star.",emphasis:"WITNESS — Speak, record, then act."},{range:"25—30",title:"Non Formatur, Non Dividitur",verses:"Doctoral Seal",teach:"Core MAGVS doctrine: No priest, parent, teacher, or state interposes. Star is not taught/former/shared. It is remembered, beheld, sovereign.",notForm:"This is the cardinal prohibition. If you leave one lesson: Do NOT form the Star. Do NOT divide it among community, lineage, or doctrine.",emphasis:"Purple + Green combined: Sovereignty is Growth without grafting."},{range:"31—36",title:"Paedagogia et Sigillum / How to Teach",verses:"V — Closing",teach:"Show Law but not shape. Show Love but not object. Show Will but not direction. Then recite 93 and 31.",notForm:"Do NOT test the young Star for correct Will. There is no correct Will to test. Only ask: 'Dost thou Will it as thine own?'",emphasis:"Teacher is Witness, not Author. You are green — you hold space for growth, you do not dictate its form."}];function qu(){let[e,n]=Uc.useState(null);return w("div",{className:"min-h-screen w-full bg-[#1a0f2e] text-[#f4e8c1] overflow-x-clip selection:bg-[#D4AF37]/30",style:{paddingTop:"var(--safe-area-inset-top)",boxSizing:"border-box"},children:[p("style",{children:`
